<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Eye v1.5 - Master Kernel</title>
    <style>
        /* Kaydırma sorununu çözen ana yapı: overflow-y ve height ayarları */
        body { background: #000; color: #00ffcc; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #header { padding: 15px; border-bottom: 2px solid #00ffcc; text-align: center; background: #001111; box-shadow: 0 0 15px #00ffcc55; font-weight: bold; flex-shrink: 0; }
        
        /* Kaydırma alanı burası: overflow-y eklendi */
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .msg { padding: 12px; border: 1px solid #00ffcc44; border-radius: 8px; max-width: 85%; position: relative; word-wrap: break-word; }
        .user { align-self: flex-end; border-color: #555; color: #fff; background: #001100; }
        .eye { align-self: flex-start; background: #001111; border-left: 4px solid #00ffcc; }
        .tag { font-size: 0.7em; color: #ffff00; text-transform: uppercase; display: block; margin-bottom: 5px; }
        
        .input-area { padding: 20px; display: flex; gap: 10px; background: #000; border-top: 1px solid #00ffcc; flex-shrink: 0; }
        input { flex: 1; background: #111; border: 1px solid #00ffcc; color: #00ffcc; padding: 12px; outline: none; border-radius: 5px; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 25px; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        /* Kaydırma çubuğunu güzelleştiren Master Kernel stili */
        #chat-box::-webkit-scrollbar { width: 8px; }
        #chat-box::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }
    </style>
</head>
<body>

<div id="header">BLUE EYE AI: MASTER KERNEL v1.5</div>
<div id="chat-box"></div>

<div class="input-area">
    <input type="text" id="userInput" placeholder="Komut, Matematik veya 'araştır: ...' yazın">
    <button onclick="processCommand()">ÇALIŞTIR</button>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('userInput');

    let kernelMemory = {
        "merhaba": "Selam usta! Tüm sistemler (Hafıza, Araştırma, İşlemci) aktif.",
        "kimsin": "Ben Blue Eye. Cihazının işlemcisini kullanan, dışa bağımsız zekayım.",
        "versiyon": "v1.5 Master Kernel - Hybrid Mode."
    };

    function processCommand() {
        const rawText = input.value.trim();
        if (!rawText) return;

        addMsg(rawText, 'user');
        const text = rawText.toLowerCase();
        let reply = "";
        let tag = "KERNEL";

        if (text.startsWith("araştır:") || text.startsWith("google:")) {
            const query = rawText.split(":")[1].trim();
            reply = `"${query}" konusunu global ağda araştırıyorum usta.`;
            tag = "RESEARCH";
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
        } 
        else if (/[0-9]/.test(text) && (text.includes("+") || text.includes("-") || text.includes("*") || text.includes("/"))) {
            try {
                const result = eval(text.replace(/[^-()\d/*+.]/g, ''));
                reply = `İşlemci sonucu hesapladı: ${result}`;
                tag = "PROCESSOR";
            } catch {
                reply = "Matematiksel bir hata oluştu usta.";
            }
        }
        else if (rawText.includes("=")) {
            const parts = rawText.split("=");
            kernelMemory[parts[0].trim().toLowerCase()] = parts[1].trim();
            reply = `'${parts[0].trim()}' bilgisini yerel diskime yazdım.`;
            tag = "MEMORY_WRITE";
        }
        else if (kernelMemory[text]) {
            reply = kernelMemory[text];
            tag = "MEMORY_READ";
        }
        else {
            reply = "Bu komut tanımlı değil. 'Araştır:' yazabilir, matematik sorabilir veya bir şey öğretebilirsin.";
            tag = "SYSTEM";
        }

        setTimeout(() => {
            addMsg(reply, 'eye', tag);
        }, 300);
        input.value = "";
        input.focus(); // Yeni komut için otomatik odaklanma
    }

    function addMsg(t, s, tagText = "") {
        const d = document.createElement('div');
        d.className = `msg ${s}`;
        if(tagText) d.innerHTML = `<span class="tag">[${tagText}]</span>${t}`;
        else d.innerText = t;
        chatBox.appendChild(d);
        
        // Kaydırmayı en alta zorlayan Master komut
        setTimeout(() => {
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 50);
    }

    input.addEventListener("keypress", (e) => { if (e.key === "Enter") processCommand(); });
    window.onload = () => {
        addMsg("Master Kernel v1.5 Başlatıldı. Cihaz gücü %100.", "eye", "BOOT");
        input.focus();
    };
</script>

</body>
</html>
