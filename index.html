<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Eye v1.1</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100-vh;
            overflow: hidden;
        }

        /* Mesajların toplandığı alan */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Mesaj baloncukları */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #222;
            border: 1px solid #444;
        }

        .ai-message {
            align-self: flex-start;
            background-color: #001a33; /* Hafif mavi tonlu siyah */
            border: 1px solid #0055ff;
        }

        /* Giriş alanı sabit */
        .input-area {
            background: #111;
            padding: 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        input {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
        }

        button {
            background: #0055ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <div class="message ai-message">Blue Eye v1.1 Aktif. Size nasıl yardımcı olabilirim?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Bir şeyler yazın...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            // Kullanıcı mesajını ekle
            addMessage(text, 'user-message');
            userInput.value = "";

            // Yapay zeka simülasyonu (Buraya kendi API'ni veya zekanı bağlayabilirsin)
            setTimeout(() => {
                const response = "Anlaşıldı. Bu konuda Blue Eye protokolü devreye giriyor...";
                addMessage(response, 'ai-message');
            }, 600);
        }

        function addMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);

            // OTOMATİK AŞAĞI KAYDIRMA (Sihirli satır)
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Enter tuşu ile gönderme
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
