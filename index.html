<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Eye v1.2 - Hafızalı</title>
    <style>
        /* Tasarım aynı kalıyor, sadece fonksiyonu güçlendiriyoruz */
        body { background-color: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px; border-radius: 10px; word-wrap: break-word; }
        .user { align-self: flex-end; background: #222; border: 1px solid #444; }
        .ai { align-self: flex-start; background: #001a33; border: 1px solid #0055ff; }
        .input-area { background: #111; padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; }
        button { background: #0055ff; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="chat-container"></div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın...">
        <button onclick="sendMessage()">Gönder</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');

        // --- HAFIZA BURADA BAŞLIYOR ---
        let chatContext = [
            {"role": "system", "content": "Senin adın Blue Eye AI. Mert'in geliştirdiği bir yapay zekasın. Her şeyi hatırlamalısın."}
        ];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Kullanıcı mesajını ekrana ve HAFIZAYA ekle
            addMessage(text, 'user');
            chatContext.push({"role": "user", "content": text});
            userInput.value = "";

            // 2. API'ye TÜM GEÇMİŞİ (chatContext) gönderiyoruz
            // Not: Buradaki fetch kısmına kendi API URL'ni ve Key'ini eklemelisin
            try {
                // ŞİMDİLİK SİMÜLASYON (Sen kendi API'ni buraya bağlayınca hafıza çalışacak)
                const aiResponse = "Az önce söylediğin '" + chatContext[chatContext.length - 1].content + "' konusunu not aldım, unutmuyorum usta!";
                
                setTimeout(() => {
                    addMessage(aiResponse, 'ai');
                    // 3. AI cevabını da HAFIZAYA ekle
                    chatContext.push({"role": "assistant", "content": aiResponse});
                    
                    // Hafıza çok şişmesin diye son 20 mesajı tut (Opsiyonel)
                    if(chatContext.length > 20) chatContext.shift(); 
                }, 500);

            } catch (error) {
                addMessage("Bağlantı hatası usta!", 'ai');
            }
        }

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    </script>
</body>
</html>
